# Local run of all three tiers: `docker compose up --build`, then open http://localhost:3000
# This mirrors the EKS layout: frontend (nginx) -> backend (Spring Boot) -> MySQL.
services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${DB_NAME:-paylane}
      MYSQL_USER: ${DB_USERNAME:-paylane}
      MYSQL_PASSWORD: ${DB_PASSWORD:-paylane}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-rootpass}
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci"]
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u$$MYSQL_USER -p$$MYSQL_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 30

  backend:
    build: ./backend
    image: paylane-backend:local
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: ${DB_NAME:-paylane}
      DB_USERNAME: ${DB_USERNAME:-paylane}
      DB_PASSWORD: ${DB_PASSWORD:-paylane}
      JWT_SECRET: ${JWT_SECRET:-local-dev-secret-please-change-0123456789abcdef}
      CORS_ALLOWED_ORIGINS: http://localhost:3000,http://localhost:5173
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@paylane.local}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Admin@12345}
    ports:
      - "8080:8080"

  frontend:
    build: ./frontend
    image: paylane-frontend:local
    depends_on:
      - backend
    environment:
      BACKEND_URL: http://backend:8080
    ports:
      - "3000:8080"

volumes:
  mysql-data:
