name: CI-build and push to docker hub 
on:
  push:
    branches: [main]
    path:
      - "backend/**"
env: 
 IMAGE_NAME: ${{ secrets.DOCKERHUB_USERNAME }}/eks-backend
 
jobs:
  build-and-push:
    runs-on: ubuntu-latest
 
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
 
      - name: Generate unique image tag
        id: vars
        run: echo "tag=${{ github.run_number }}.${{ github.run_attempt }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
 
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
 
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
 
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ env.IMAGE_NAME }}:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
 
