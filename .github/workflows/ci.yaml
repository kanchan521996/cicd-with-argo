name: CI-build and push to docker hub

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
  workflow_dispatch:   # Actions tab se manual run ke liye

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: kanchannath

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Check values
        run: |
          [ -z "${{ vars.DOCKERHUB_USERNAME }}" ] && echo "USERNAME is EMPTY" || echo "USERNAME is set"
          [ -z "${{ secrets.DOCKERHUB_TOKEN }}" ] && echo "TOKEN is EMPTY" || echo "TOKEN is set"

      - name: Generate unique image tag
        id: vars
        run: echo "tag=${{ github.run_number }}.${{ github.run_attempt }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/eks-backend:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max