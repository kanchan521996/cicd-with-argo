name: CI-CD build, push and update helm tag

on:
  push:
    branches: [main]
    paths:
      - "backend/**"   # helm/ me change hone par workflow nahi chalega (loop nahi banega)
  workflow_dispatch:

permissions:
  contents: write   # isi repo me values.yaml commit/push karne ke liye

env:
  VALUES_FILE: helm/values.yaml   # <-- agar chart kisi subfolder me hai to badlo, jaise helm/eks-app/values.yaml

jobs:
  # ---------- CI: image build + push ----------
  build-and-push:
    runs-on: ubuntu-latest
    environment: kanchannath
    outputs:
      tag: ${{ steps.vars.outputs.tag }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate unique image tag
        id: vars
        run: echo "tag=${{ github.run_number }}.${{ github.run_attempt }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU (multi-arch build ke liye)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ vars.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.DOCKERHUB_USERNAME }}/eks-backend:${{ steps.vars.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------- CD: helm/values.yaml me backend tag update ----------
  update-helm-tag:
    needs: build-and-push
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Update backend image tag
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          yq -i '.backend.image.tag = strenv(NEW_TAG)' ${{ env.VALUES_FILE }}
          grep -n "tag:" ${{ env.VALUES_FILE }}

      - name: Commit and push
        env:
          NEW_TAG: ${{ needs.build-and-push.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add ${{ env.VALUES_FILE }}
          git commit -m "ci: update backend image tag to ${NEW_TAG}" || echo "No changes to commit"
          git pull --rebase origin main
          git push origin HEAD:main