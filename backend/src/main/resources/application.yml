server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful            # finish in-flight requests when the pod gets SIGTERM

spring:
  application:
    name: paylane-backend
  lifecycle:
    timeout-per-shutdown-phase: 25s
  datasource:
    url: ${DB_URL:jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3306}/${DB_NAME:paylane}?useSSL=${DB_USE_SSL:false}&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:paylane}
    password: ${DB_PASSWORD:paylane}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
      minimum-idle: 2
      connection-timeout: 10000
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: none            # Flyway owns the schema
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      probes:
        enabled: true           # /actuator/health/liveness and /actuator/health/readiness
      show-details: never
  health:
    livenessstate:
      enabled: true
    readinessstate:
      enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  jwt:
    # Must be at least 32 characters. Override with JWT_SECRET in every real environment.
    secret: ${JWT_SECRET:change-me-this-is-a-dev-only-secret-key-0123456789}
    expiration-minutes: ${JWT_EXPIRATION_MINUTES:120}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS\:http\://localhost:5173,http\://localhost:3000,http\://127.0.0.1:*}
  wallet:
    currency: ${WALLET_CURRENCY:USD}
    default-daily-limit: ${WALLET_DAILY_LIMIT:5000.00}
    max-transaction-amount: ${WALLET_MAX_TXN_AMOUNT:10000.00}
  admin:
    email: ${ADMIN_EMAIL:admin@paylane.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
    full-name: ${ADMIN_FULL_NAME:Paylane Admin}

logging:
  pattern:
    level: "%5p [${spring.application.name},%X{requestId:-}]"
